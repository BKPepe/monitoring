name: Release

# A v* tag publishes the installable package (site W1-4). This job used to
# attach only the agent scripts, and no tag was ever pushed, so the site's
# download pointed at an empty releases page and the only way in was GitHub's
# source ZIP - without the agents, because the submodule used an SSH URL.
#
# The package is ONE asset under a fixed name, bloodkings-monitoring.zip, so
# the site links releases/latest/download/bloodkings-monitoring.zip for every
# version. It holds exactly what the hosting serves: status/ (the PHP app plus
# the agents, assembled as deploy-status.yml does it) and app/ (the built app
# with its .htaccess). config.php is never in it: it holds the DB password.
#
# Never marked as a pre-release, not even for an -alpha tag: GitHub's "latest
# release" skips pre-releases, and both the fixed download URL and the site's
# release line (worker /api/versions) read "latest". The alpha label lives in
# the tag and on the site instead.
#
# The owner picks and pushes the tags; nothing here creates one.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build the package and publish the release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The agents live in their own repository (submodule `agents`).
          submodules: true
          # The job holds contents: write, and `npm ci` then runs every
          # dependency's install scripts and the build runs third-party code.
          # Left in .git/config, the token would let a compromised package push
          # to main, which deploys to production. Only the publish step needs
          # it, and it gets it through its own input.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Build the app
        run: |
          npm ci
          npm run build --workspace=apps/monitor

      - name: Assemble status/ and app/
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The tag lands in version.php below; anything but a plain version
          # string could break out of the PHP string, so it is checked first.
          if ! [[ "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "::error::unexpected tag name: $TAG"
            exit 1
          fi
          PKG="$RUNNER_TEMP/pkg"
          mkdir -p "$PKG"
          cp -R apps/status "$PKG/status"
          cp -R apps/monitor/dist "$PKG/app"
          # MIT asks for the notice in every copy, and PHPMailer in status/lib
          # (LGPL-2.1) for its own; THIRD_PARTY_NOTICES.md names it.
          cp LICENSE THIRD_PARTY_NOTICES.md "$PKG/"

          # The same five files and the same check as deploy-status.yml: an
          # installed server serves them to its agents for install and
          # self-update, so a package without them is broken on day one.
          for f in agent.sh agent.py agent.ps1 agent_openwrt.sh docker-compose.agent.yml; do
            cp "agents/vps-agent/$f" "$PKG/status/$f"
            test -s "$PKG/status/$f" || { echo "::error::agent file missing or empty: $f"; exit 1; }
          done

          # What never ships: secrets and machine state, the test suites (on a
          # server they ran for anyone who opened them), git bookkeeping.
          rm -rf "$PKG/status/tests" "$PKG/status/cache" "$PKG/status/node_modules"
          rm -f "$PKG/status/config.php" "$PKG/status/cpanel_config.php"
          find "$PKG" -type f -name '.git*' -delete

          # The version the app shows, in the format the deploy writes. Without
          # the file an installed copy falls back to `git log` and says "dev".
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > "$PKG/status/version.php" << PHPEOF
          <?php
          // Generated by the release workflow - do not edit.
          define('APP_VERSION_HASH', '${SHORT_SHA}');
          define('APP_VERSION_DATE', '${BUILT}');
          define('APP_VERSION_LABEL', '${TAG} · ${SHORT_SHA}');
          PHPEOF
          php -l "$PKG/status/version.php"

      - name: Zip, check the contents, write SHA256SUMS
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$OUT"
          (cd "$RUNNER_TEMP/pkg" && zip -qr -X "$OUT/bloodkings-monitoring.zip" LICENSE THIRD_PARTY_NOTICES.md status app)

          # Checked before publishing, not after someone downloads it.
          listing=$(unzip -Z1 "$OUT/bloodkings-monitoring.zip")
          # installer.php: the site's install guide starts at /app/setup.
          for need in LICENSE THIRD_PARTY_NOTICES.md status/api.php status/cron.php status/schema.sql \
            status/config.sample.php status/installer.php status/lib/PHPMailer.php status/version.php \
            status/agent.sh status/agent_openwrt.sh status/agent.py status/agent.ps1 \
            app/index.html app/public.html app/.htaccess; do
            grep -qxF "$need" <<< "$listing" || { echo "::error::missing from the package: $need"; exit 1; }
          done
          # A deploy's sync state would keep every installed copy's installer locked.
          if grep -E '(^|/)(config|cpanel_config)\.php$|^status/tests/|(^|/)\.ftp-deploy-sync-state\.json$' <<< "$listing"; then
            echo "::error::the package carries a secret, the test suites or a deploy's sync state (listed above)"
            exit 1
          fi

          # The agent scripts stay attached on their own, as before.
          for f in agent.sh agent.py agent.ps1 agent_openwrt.sh docker-compose.agent.yml; do
            cp "agents/vps-agent/$f" "$OUT/$f"
          done
          (cd "$OUT" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: 'true'

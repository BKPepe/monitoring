name: Deploy Status App to cPanel

# Runs only from deploy-hosting.yml, which decides what changed and keeps the
# FTP deploys in one queue (see there). Its own push trigger and concurrency
# group are gone: a called workflow must not hold the caller's group (GitHub
# cancels it as a deadlock), and the shared group lost deploys (4a81b64).
on:
  workflow_call:

jobs:
  deploy:
    name: Build and Deploy Status App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Agenti bydli v samostatnem repozitari (submodul `agents`), ale
          # servirovat se musi z /status/ - odtud si je routery stahuji pri
          # self-update. Bez submodulu by se nasadila stranka bez agentu a
          # kazdy nasazeny router by dostal 404 misto aktualizace.
          submodules: true

      - name: Zkopirovat agenty ze submodulu do nasazovane slozky
        run: |
          set -e
          for f in agent.sh agent.py agent.ps1 agent_openwrt.sh docker-compose.agent.yml; do
            cp "agents/vps-agent/$f" "apps/status/$f"
          done
          # Kontrola, ze soubory opravdu dorazily: prazdny nebo chybejici agent
          # by se jinak nahral az na produkci a projevil se rozbitym
          # self-updatem, ne chybou v CI.
          for f in agent.sh agent.py agent.ps1 agent_openwrt.sh docker-compose.agent.yml; do
            test -s "apps/status/$f" || { echo "CHYBI nebo je prazdny: $f"; exit 1; }
          done
          echo "Agenti zkopirovani ze submodulu:"
          grep -H -m1 'AGENT_VERSION' apps/status/agent.sh apps/status/agent_openwrt.sh

      - name: Run PHP unit tests (pure functions)
        run: php apps/status/tests/run_tests.php

      - name: Run pipeline tests (collection, e-mail, notifications)
        run: php apps/status/tests/run_pipeline_tests.php

      - name: PHP syntax check
        run: |
          set -e
          for f in apps/status/*.php apps/status/lang/*.php; do
            php -l "$f" > /dev/null
          done
          echo "All PHP files parse cleanly."

      - name: Agent script syntax check
        run: |
          set -e
          # agent.sh má shebang #!/bin/bash a bashismy používá záměrně;
          # agent_openwrt.sh musí být čistý POSIX (routery mají ash/dash).
          bash -n agents/vps-agent/agent.sh
          dash -n agents/vps-agent/agent_openwrt.sh
          python3 -m py_compile agents/vps-agent/agent.py
          echo "Agent scripts parse cleanly."

      - name: Inject Status Database Config
        env:
          STATUS_CONFIG_PHP: ${{ secrets.STATUS_CONFIG_PHP || secrets.status_config_php }}
        # No fallback to config.sample.php: with the web installer (site W1-5)
        # a config that still holds the sample's placeholder password reads as
        # "not installed yet", and /app/setup would let any visitor point
        # production at their own database. Deleting the file is no way out
        # either - the FTP sync removes it remotely, and a missing config.php
        # opens the installer too. So a missing or botched secret stops the
        # deploy before anything is uploaded. Nothing of the secret is printed.
        run: |
          if [ -z "$STATUS_CONFIG_PHP" ]; then
            echo "::error::STATUS_CONFIG_PHP is not set. Refusing to deploy: a placeholder config.php would open /app/setup on production."
            exit 1
          fi
          printf '%s' "$STATUS_CONFIG_PHP" > apps/status/config.php
          if ! php -l apps/status/config.php > /dev/null 2>&1; then
            echo "::error::STATUS_CONFIG_PHP is not valid PHP (php -l failed; output hidden, it may quote the file). Refusing to deploy."
            exit 1
          fi
          # The value of DB_PASS as PHP reads it, judged by the server's own rule
          # (bk_config_is_placeholder in db.php): define( 'DB_PASS', ...) with any
          # spacing or `const DB_PASS = ...` counts the same, and the words in a
          # comment do not. A grep missed the first two (SEC-W2M-2). The file is
          # loaded second, so its direct-access guard stays quiet; nothing of it
          # is printed, and only the marker line decides.
          cat > "$RUNNER_TEMP/bk_config_check.php" << 'PHPEOF'
          <?php
          require $argv[1];
          foreach (['DB_HOST', 'DB_NAME', 'DB_USER', 'DB_PASS'] as $c) {
              if (!defined($c)) {
                  echo "\nBK_CONFIG=missing\n";
                  exit(0);
              }
          }
          echo in_array(DB_PASS, ['heslo_databaze', 'database_password'], true) ? "\nBK_CONFIG=placeholder\n" : "\nBK_CONFIG=ok\n";
          PHPEOF
          verdict=$(php "$RUNNER_TEMP/bk_config_check.php" apps/status/config.php 2> /dev/null | grep -o 'BK_CONFIG=[a-z]*' | tail -n 1 || true)
          rm -f "$RUNNER_TEMP/bk_config_check.php"
          case "$verdict" in
            BK_CONFIG=ok) ;;
            BK_CONFIG=placeholder)
              echo "::error::STATUS_CONFIG_PHP still holds the sample's placeholder password. Refusing to deploy."
              exit 1 ;;
            BK_CONFIG=missing)
              echo "::error::STATUS_CONFIG_PHP does not define DB_HOST, DB_NAME, DB_USER and DB_PASS. Refusing to deploy."
              exit 1 ;;
            *)
              echo "::error::STATUS_CONFIG_PHP could not be loaded (output hidden). Refusing to deploy."
              exit 1 ;;
          esac
          echo "apps/status/config.php created from the STATUS_CONFIG_PHP secret."

      - name: Generate Version File
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DEPLOY_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > apps/status/version.php << PHPEOF
          <?php
          // Automaticky vygenerováno GitHub Actions deployem – NEUPRAVUJTE RUČNĚ
          define('APP_VERSION_HASH', '${SHORT_SHA}');
          define('APP_VERSION_DATE', '${DEPLOY_DATE}');
          define('APP_VERSION_LABEL', '${DEPLOY_DATE} · ${SHORT_SHA}');
          PHPEOF
          echo "Version file generated: ${DEPLOY_DATE} · ${SHORT_SHA}"

      - name: FTP Deploy to cPanel (status/ subfolder)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER || secrets.server || secrets.FTP_server }}
          username: ${{ secrets.FTP_USERNAME || secrets.username || secrets.FTP_username }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_password }}
          local-dir: ./apps/status/
          # The installer stays locked while this action's sync state
          # (.ftp-deploy-sync-state.json, the default state name) sits next to
          # installer.php (bk_install_dispatch). Setting a state name, moving
          # server-dir to a parent or deploying another way turns that lock off
          # without a sound; run_tests.php fails on any of the three.
          server-dir: public_html/status/
          protocol: ftps
          # The action's default is "loose": TLS without a certificate check.
          # The hosting's certificate is valid for FTP_SERVER (the curl steps
          # below verify it on every deploy), so nothing justifies skipping it.
          security: strict
          # Stejny duvod jako v deploy-go.yml: `timeout` je necinnost ridiciho
          # socketu. Po predchozim deployi jeste nejsou uvolnena FTP sezeni a
          # server odpovi az za desitky sekund - v 60 s se to nestihlo.
          timeout: 300000
          retry: 3
          # tests/ never belonged on the server: the suites ran for anyone who
          # opened them. .htaccess keeps any copy already deployed out of reach.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tests/**

      # Agenti se nahravaji vzdy, nezavisle na sync stavu FTP akce.
      #
      # Ta si na serveru drzi seznam souboru s hashi a co povazuje za aktualni,
      # to uz neposle. Kdyz nekdo soubor odstrani mimo nasazeni - malware
      # skener hostingu poslal agent.sh do karanteny tri nasazeni po sobe -
      # zadne dalsi nasazeni ho samo nevrati, protoze podle sveho stavu nema
      # co delat. Ctyri male soubory, na kterych stoji self-update a navod na
      # instalaci, proto jdou nahoru pokazde.
      - name: Nahrát agenty vždy (nezávisle na sync stavu FTP akce)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.server || secrets.FTP_server }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || secrets.username || secrets.FTP_username }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || secrets.FTP_password }}
        run: |
          set -eu
          # Jedno prihlaseni na vsechny ctyri soubory: curl si spojeni podrzi
          # a posle je za sebou. Ctyri samostatna volani = ctyri FTP sezeni,
          # a tech ma ucet na hostingu jen par.
          curl --silent --show-error --ssl-reqd --ftp-pasv --connect-timeout 20 --max-time 300 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T "apps/status/agent.sh" "ftp://$FTP_SERVER/public_html/status/agent.sh" \
            -T "apps/status/agent.py" "ftp://$FTP_SERVER/public_html/status/agent.py" \
            -T "apps/status/agent.ps1" "ftp://$FTP_SERVER/public_html/status/agent.ps1" \
            -T "apps/status/agent_openwrt.sh" "ftp://$FTP_SERVER/public_html/status/agent_openwrt.sh"
          echo "nahrany: agent.sh, agent.py, agent.ps1, agent_openwrt.sh"

      # Po nasazeni se kazda verejna stranka pozada, jestli neupadla.
      # widget.php a badge.php takhle mesice vracely 500 (volaly funkci,
      # ktera v kodu nebyla) a nikdo si toho nevsiml - php -l chybu za
      # behu nevidi a nikdo ty stranky neotviral.
      - name: Setup PHP pro smoke test
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring

      - name: Smoke test nasazených stránek
        run: |
          sleep 5
          php apps/status/tests/run_page_smoke.php

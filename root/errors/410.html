<!doctype html>
<!-- Served by the bloodkings.eu root .htaccess (ErrorDocument 410) for any
     path. Self-contained on purpose: no stylesheet, font, image or script is
     fetched, so the page still renders when the origin itself is failing. -->
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>410 · Stránka byla odstraněna | Blood Kings</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --card: #f7f8fa;
      --fg: #0b0d10;
      --muted: #4b5563;
      --border: rgb(0 0 0 / 0.1);
      --brand: #a30d18;
      --brand-hover: #8a0b14;
      --on-brand: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0c0f;
        --card: #111418;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: rgb(255 255 255 / 0.1);
        --brand: #d62b30;
        --brand-hover: #b9232a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 4px solid var(--brand);
      border-radius: 12px;
      overflow-wrap: anywhere;
    }
    .brand { font-weight: 700; letter-spacing: 0.02em; color: var(--brand); }
    .code {
      margin: 16px 0 4px;
      font-size: 3rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    h1 { font-size: 1.5rem; line-height: 1.25; margin-bottom: 8px; }
    h2 { font-size: 1.125rem; line-height: 1.3; margin-bottom: 6px; }
    p { color: var(--muted); }
    .en { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .btn {
      display: inline-flex;
      flex: 1 1 200px;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .btn span { font-size: 0.8125rem; font-weight: 400; }
    .btn:hover { border-color: var(--brand); }
    .btn:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .btn.primary:hover { background: var(--brand-hover); }
  </style>
</head>
<body>
  <main>
    <p class="brand">Blood Kings</p>
    <p class="code">410</p>
    <h1>Stránka byla odstraněna</h1>
    <p>Tato adresa už trvale neexistuje a nevrátí se.</p>
    <div class="en" lang="en">
      <h2>Page removed</h2>
      <p>This address is gone for good and will not come back.</p>
    </div>
    <nav class="actions" aria-label="Kam dál / Where next">
      <a class="btn primary" href="https://bloodkings.eu/">Hlavní stránka <span lang="en">Home page</span></a>
      <a class="btn" href="https://bloodkings.eu/app/public">Stav služeb <span lang="en">Service status</span></a>
    </nav>
  </main>
</body>
</html>

; PHP settings for everything under /status/, read by the host's PHP at startup.
;
; The session cookie carries the admin login. Without these flags it was
; readable by any script injected into a page (no HttpOnly) and was sent along
; with requests other sites trigger (no SameSite). The deployed config.php
; starts the session without its own flags, so they are set here, before any
; code runs. db.php sets the same values in code for a host that ignores this
; file (PHP's built-in server does), except Secure: that one is set here
; unconditionally because production is HTTPS only, and in code only for a
; request that came over HTTPS.
;
; The web server refuses to serve this file (.htaccess).

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
